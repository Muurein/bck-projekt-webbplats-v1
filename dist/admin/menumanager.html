<!DOCTYPE html><html lang="sv"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornborgarsjöns Café - Menyhanteraren</title>

    <link rel="stylesheet" href="/about.eaecfc38.css">
    <script src="/about.b3a6bc7d.js" type="module"></script>
</head>

<body>
    <header>
        <!--logga-->
        <div class="branding">
            <p class="logo">HC</p>
            <p class="logo-p">Hornborgarsjöns café</p>
            <p class="admin-p">Administrationspanel</p>
        </div>

        <!--huvudmeny-->
        <nav>
            <ul class="main-menu">
                <li><a href="/admin/adminindex.html">HEM</a></li>
                <li class="current-page">MENYHANTERAREN</li>
                <li><a href="/admin/login.html">LOGGA IN</a></li>
            </ul>
        </nav>
    </header>


    
    
    <main>
        <div class="main-form">
            <div>
                <h1>Menyhanteraren</h1>
                <h2>Lägg till i menyn</h2>
            </div>

            <form id="menu-form">
                <div>
                    <label for="category">Kategori</label>
                    <br>
                    <select name="category" id="category" class="user-input">
                        <option value="sandwich">Macka</option>
                        <option value="pie">Paj</option>
                        <option value="dessert">Fika</option>
                        <option value="drink">Dryck</option>
                    </select>
                </div>

                <div>
                    <label for="name">Namn</label>
                    <br>
                    <input type="text" id="name" name="name" class="user-input"> 
                </div>

                <div>
                    <label for="description">Innehållsbeskrivning</label>
                    <br>
                    <input type="text" id="description" name="description" class="user-input"> 
                </div>

                <div>
                    <label for="price">Pris</label>
                    <br>
                    <input type="text" id="price" name="price" class="user-input"> 
                </div>

                <!--felmeddelanden-->
                <p id="error-message"></p>
                <p id="fillInAllMenu"></p>

                <div>
                    <input id="post-menu-button" type="submit" value="Lägg till">
                </div>
            </form>
        </div>

        <div class="border"></div>

        <section class="main-items main-items-admin">
            <div class="menu-gridbox">
                <div class="gridbox-div">
                    <h2>MACKOR</h2>
                    <div id="sandwiches-container" class="item-div">
                            
                    </div>
                </div>

                <div class="gridbox-div">
                    <h2>PAJER</h2>
                    <div id="pies-container" class="item-div">
                            
                    </div>
                </div>

                <div class="gridbox-div">
                    <h2>FIKA</h2>
                    <div id="desserts-container" class="item-div">
                        
                    </div>
                </div>

                <div class="gridbox-div">
                    <h2>DRYCKER</h2>
                    <div id="drinks-container" class="item-div">
                            
                    </div>
                </div>
        </div>

            <!-- <h3>MACKOR</h3>
            <div id="sandwiches-container">
                
            </div>

            <h3>PAJER</h3>
            <div id="pies-container">

            <h3>FIKA</h3>
            <div id="desserts-container">
                
            </div>

            <h3>DRINKAR</h3>
            <div id="drinks-container">
                
            </div> -->

        </section>
    </main>

</body></html>
