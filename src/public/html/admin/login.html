<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hornborgarsjöns Café - Hem</title>

    <link rel="stylesheet" href="../../css/main.scss">
    <script src="../../js/main.js" type="module"></script>
</head>

<body>
    <header>
        <!--logga-->
        <div class="branding">
            <p class="logo">HC</p>
            <p class="logo-p">Hornborgarsjöns café</p>
            <p class="admin-p">Administrationspanel</p>
        </div>

        <!--huvudmeny-->
        <nav>
            <ul class="main-menu">
                <li><a href="adminindex.html">HEM</a></li>
                <li><a href="menumanager.html">MENYHANTERAREN</a></li>
                <li class="current-page">LOGGA IN</li>
            </ul>
        </nav>
    </header>


    
    
    <main class="main-form">
        <h1>Logga in</h1>

        <form id="login-form">
            <div>
                <label for="username">Användarnamn</label>
                <br>
                <input type="text" id="username" name="username" class="user-input"> 
            </div>

            <div>
                <label for="password">Lösenord</label>
                <br>
                <input type="password" id="password" name="password" class="user-input"> 
            </div>

            <!--felmeddelanden-->
            <p id="incorrectInfoLogin"></p>
            <p id="fillInAllLogin"></p>

            <div>
                <input id="login-button" type="submit" value="Logga in" class="login-button">
            </div>

        </form>

        <!--logga ut-->
        <button type="button" id="logout-button" class="login-button">Logga ut</button>
    </main>
</body>
</html>
